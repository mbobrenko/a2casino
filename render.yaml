# Render Blueprint: free demo of A2Casino (Postgres + API + player site + back office).
# Render: New -> Blueprint -> pick this repo -> Apply. Every push to main redeploys.
#
# Free-plan limits: services sleep after 15 minutes without traffic (the first request then
# takes ~1 minute).
#
# Database: Render allows one free Postgres per account, so the database is external
# (Neon free tier, https://neon.tech). Render asks for DATABASE_URL when the Blueprint
# is applied: paste Neon's connection string (postgresql://...?sslmode=require).
#
# The front ends need the API's public URL at build time. These URLs assume Render keeps the
# service names below; if it had to rename a service, update the three URLs and push.
services:
  - type: web
    name: a2casino-mb-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon connection string, entered in Render
      - key: ADDR
        value: ":10000"
      - key: PORT
        value: "10000"
      - key: CALLBACK_URL
        value: http://localhost:10000
      - key: PUBLIC_URL
        value: https://a2casino-mb-api.onrender.com
      - key: WEB_URL
        value: https://a2casino-mb-web.onrender.com
      - key: CORS_ORIGINS
        value: https://a2casino-mb-web.onrender.com,https://a2casino-mb-admin.onrender.com
      - key: DEV_TOOLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_PROVIDER_SECRET
        generateValue: true
      - key: PSP_WEBHOOK_SECRET
        generateValue: true
      - key: CRYPTO_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # Render asks for it when the Blueprint is created

  - type: web
    name: a2casino-mb-web
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL   # passed to the Docker build as a build arg
        value: https://a2casino-mb-api.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: a2casino-mb-admin
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backoffice
    dockerfilePath: ./backoffice/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://a2casino-mb-api.onrender.com
      - key: PORT
        value: "10000"
